name: blog-edge
description: >-
  Public entry for m4nuel.blog and www: a Cloudflare Tunnel whose connector runs
  next to the blog-prod container, plus the zone's bot and rate-limit rules. The
  VPS opens no web port. prod stack only.
runtime: yaml

config:
  domain:
    type: string
    default: m4nuel.blog
  cloudflaredImage:
    type: string
    default: cloudflare/cloudflared:2026.11.1
  vpsHost:
    type: string
    default: 158.69.218.225
  vpsUser:
    type: string
    default: debian
  vpsHostKey:
    type: string
    default: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjpObIuSVN3TC00jbHxg8wnawZpvcSJ70jiZ9aUGjmt
  sshKey:
    type: string
    secret: true

variables:
  app: blog-${pulumi.stack}
  connection:
    host: ${vpsHost}
    user: ${vpsUser}
    hostKey: ${vpsHostKey}
    privateKey: ${sshKey}
  zone:
    fn::invoke:
      function: cloudflare:getZone
      arguments:
        filter:
          name: ${domain}
          match: all
      options:
        version: 6.24.0
  # Secret in the provider schema; wrapped as well so `return:` cannot drop it.
  token:
    fn::secret:
      fn::invoke:
        function: cloudflare:getZeroTrustTunnelCloudflaredToken
        arguments:
          accountId: ${zone.account.id}
          tunnelId: ${tunnel.id}
        options:
          version: 6.24.0
        return: token

resources:
  tunnel:
    type: cloudflare:ZeroTrustTunnelCloudflared
    properties:
      accountId: ${zone.account.id}
      name: ${app}
      configSrc: cloudflare
    options:
      version: 6.24.0

  tunnelConfig:
    type: cloudflare:ZeroTrustTunnelCloudflaredConfig
    properties:
      accountId: ${zone.account.id}
      tunnelId: ${tunnel.id}
      config:
        ingresses:
          - hostname: ${domain}
            service: http://${app}:3000
          - hostname: www.${domain}
            service: http://${app}:3000
          - service: http_status:404
    options:
      version: 6.24.0

  # Cutover, runs once when created: a tunnel CNAME cannot coexist with A/AAAA
  # records or another CNAME of the same name, so those go at the apex and www.
  # MX/TXT and the tunnel CNAMEs below are never touched. Uses the runner's
  # CLOUDFLARE_API_TOKEN.
  clearConflicts:
    type: command:local:Command
    properties:
      environment:
        DOMAIN: ${domain}
        ZONE: ${zone.id}
      create: |
        set -eu
        base="https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records"
        for name in "$DOMAIN" "www.$DOMAIN"; do
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base?name=$name&per_page=100" \
            | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or (.type == "CNAME" and (.content | endswith(".cfargotunnel.com") | not))) | .id' \
            | while read -r id; do
                curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$id" >/dev/null
                echo "removed $id"
              done
        done
    options:
      version: 1.3.0

  apex:
    type: cloudflare:DnsRecord
    properties:
      zoneId: ${zone.id}
      name: ${domain}
      type: CNAME
      content: ${tunnel.id}.cfargotunnel.com
      proxied: true
      ttl: 1
      comment: Cloudflare Tunnel to ${app}
    options:
      version: 6.24.0
      dependsOn:
        - ${clearConflicts}

  www:
    type: cloudflare:DnsRecord
    properties:
      zoneId: ${zone.id}
      name: www.${domain}
      type: CNAME
      content: ${tunnel.id}.cfargotunnel.com
      proxied: true
      ttl: 1
      comment: Cloudflare Tunnel to ${app}
    options:
      version: 6.24.0
      dependsOn:
        - ${clearConflicts}

  bots:
    type: cloudflare:Ruleset
    properties:
      zoneId: ${zone.id}
      kind: zone
      name: Custom rules
      phase: http_request_firewall_custom
      rules:
        - action: block
          description: Block verified bots other than search engines and link previews
          expression: (cf.client.bot) and not (cf.verified_bot_category in {"Search Engine Crawler" "Page Preview Service"})
          enabled: true
    options:
      version: 6.24.0

  rateLimit:
    type: cloudflare:Ruleset
    properties:
      zoneId: ${zone.id}
      kind: zone
      name: Rate limits
      phase: http_ratelimit
      rules:
        - action: block
          description: 100 requests per 10 s per client IP
          expression: "true"
          enabled: true
          ratelimit:
            characteristics:
              - cf.colo.id
              - ip.src
            period: 10
            requestsPerPeriod: 100
            mitigationTimeout: 10
    options:
      version: 6.24.0

  # The tunnel token arrives on stdin; it lives only in the container's env.
  connector:
    type: command:remote:Command
    properties:
      connection: ${connection}
      stdin: ${token}
      create: |
        set -eu
        token=$(cat)
        docker pull --quiet ${cloudflaredImage}
        docker rm -f ${app}-tunnel >/dev/null 2>&1 || true
        docker run -d --name ${app}-tunnel --network ${app} \
          --restart unless-stopped --read-only --cap-drop ALL \
          --security-opt no-new-privileges --memory 128m --pids-limit 64 \
          -e TUNNEL_TOKEN="$token" ${cloudflaredImage} tunnel --no-autoupdate run
      delete: docker rm -f ${app}-tunnel >/dev/null 2>&1 || true
    options:
      version: 1.3.0
      dependsOn:
        - ${tunnelConfig}
      deleteBeforeReplace: true

outputs:
  tunnelId: ${tunnel.id}
  url: https://${domain}
