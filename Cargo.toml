[package]
name = "blog"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Markdown blog in Rust: Leptos SSR + WASM hydration, Conway's Game of Life background"
license = "MIT"
repository = "https://github.com/m4nyu/blog"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blog"
path = "src/main.rs"

[dependencies]
leptos = "0.8.23"
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }

# server only
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"], optional = true }
tower-http = { version = "0.7", features = ["set-header", "compression-br", "compression-gzip"], optional = true }
http = { version = "1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }

# browser only
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
send_wrapper = { version = "0.6", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "EventTarget",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlDocument",
  "ImageData",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "Storage",
  "Window",
] }

[features]
hydrate = [
  "leptos/hydrate",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:send_wrapper",
  "dep:web-sys",
]
ssr = [
  "leptos/ssr",
  "leptos/nonce",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:tower-http",
  "dep:http",
  "dep:pulldown-cmark",
]

# Server: unwinding stays on, so a panicking request kills its task, not the process.
[profile.release]
codegen-units = 1
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.leptos]
output-name = "blog"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
hash-files = true
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
