name: Deploy to OVH VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop blog 2>/dev/null || true
            docker rm blog 2>/dev/null || true
            docker run -d \
              --name blog \
              --restart unless-stopped \
              -p ${{ secrets.BLOG_PORT || '3000' }}:${{ secrets.BLOG_PORT || '3000' }} \
              -e PORT=${{ secrets.BLOG_PORT || '3000' }} \
              -e LEPTOS_SITE_ADDR="0.0.0.0:${{ secrets.BLOG_PORT || '3000' }}" \
              -e LEPTOS_OUTPUT_NAME=blog \
              -e LEPTOS_SITE_ROOT=site \
              -e LEPTOS_SITE_PKG_DIR=pkg \
              -e RUST_LOG=info \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
