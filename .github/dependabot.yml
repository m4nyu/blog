version: 2
# Every dependency, daily, one grouped PR per ecosystem. CI's automerge job
# merges it once the checks pass; main then deploys.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
